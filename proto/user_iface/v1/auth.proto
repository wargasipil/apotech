syntax = "proto3";

package user_iface.v1;

import "auth_iface/v1/policy.proto";
import "user_iface/v1/users.proto";

option go_package = "github.com/apotech/backend/gen/user_iface/v1;userifacev1";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (auth_iface.v1.public) = true;
  }
  rpc Me(MeRequest) returns (MeResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  int64 expires_at = 3;
}

message MeRequest {}
message MeResponse {
  User user = 1;
}
