syntax = "proto3";

package inventory_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/apotech/backend/gen/inventory_iface/v1;inventoryifacev1";

message Medicine {
  reserved 4;
  reserved "manufacturer";
  string id = 1;
  string sku = 2;
  string name = 3;
  string unit = 5;
  int64 unit_price = 6;
  bool prescription_required = 7;
  bool active = 8;
  int64 created_at = 9;
  int64 ready_stock = 10;     // on-hand in the active warehouse (list enrich)
  int64 on_order_stock = 11;  // incoming on open POs (list enrich)
  string last_restock_date = 12;      // YYYY-MM-DD of most recent batch receive (GetMedicine only)
  string last_restock_supplier = 13;  // supplier of that batch (GetMedicine only)
  int64 total_stock = 14;             // global on-hand across all warehouses (GetMedicine only)
  int64 stock_valuation = 15;         // global value at cost = Σ qty × cost_price (GetMedicine only)
  repeated MedicineUnit units = 16;   // units of measure (base + larger packs)
  int64 reference_cost = 17;          // latest batch cost_price, per base unit (GetMedicine only; 0 if none)
  string last_stocktake_date = 18;    // YYYY-MM-DD of most recent COMPLETED stocktake touching this medicine in the active warehouse (GetMedicine only; empty if none)
  int64 last_stocktake_variance = 19; // signed sum(counted_qty − expected_qty) for this medicine's lines in that session, BASE units (GetMedicine only)
}

// A unit of measure for a medicine. Stock is stored in the base unit (factor 1);
// larger units convert via `factor` (base units per 1 of this unit).
message MedicineUnit {
  string id = 1;
  string medicine_id = 2;
  string name = 3;
  int64 factor = 4;          // base units per 1 of this unit (base = 1)
  bool is_base = 5;
  int64 sell_price = 6;      // independent, minor currency
  bool sellable = 7;
  bool purchasable = 8;      // Phase 2
  int32 sort_order = 9;
  bool active = 10;
}

message MedicineUnitInput {
  string id = 1;             // empty = create new
  string name = 2;
  int64 factor = 3;
  bool is_base = 4;
  int64 sell_price = 5;
  bool sellable = 6;
  bool purchasable = 7;
  int32 sort_order = 8;
  bool active = 9;
}

message MedicinePrice {
  string id = 1;
  string medicine_id = 2;
  int64 unit_price = 3;
  int64 effective_from = 4;
  int64 effective_to = 5;
  string changed_by = 6;
}

// Per-unit sell-price history (one open row per unit; effective_to 0 = current).
message MedicineUnitPrice {
  string id = 1;
  string medicine_unit_id = 2;
  string unit_name = 3;          // denormalized for display
  int64 unit_sell_price = 4;
  int64 effective_from = 5;
  int64 effective_to = 6;        // 0 = open/current
  string changed_by = 7;
}

service MedicineService {
  rpc ListMedicines(ListMedicinesRequest) returns (ListMedicinesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  rpc GetMedicine(GetMedicineRequest) returns (GetMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  rpc CreateMedicine(CreateMedicineRequest) returns (CreateMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateMedicine(UpdateMedicineRequest) returns (UpdateMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ArchiveMedicine(ArchiveMedicineRequest) returns (ArchiveMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListMedicinePrices(ListMedicinePricesRequest) returns (ListMedicinePricesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListMedicineUnitPrices(ListMedicineUnitPricesRequest) returns (ListMedicineUnitPricesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SearchMedicines(SearchMedicinesRequest) returns (SearchMedicinesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  // ResolveMedicines returns minimal display refs for a set of ids (batch
  // lookup-by-IDs for name resolution; never a full-list preload).
  rpc ResolveMedicines(ResolveMedicinesRequest) returns (ResolveMedicinesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  // ListLowStock returns active medicines whose ready_stock in the caller's
  // active warehouse is <= the low-stock threshold (Settings.low_stock_threshold).
  // Drives the TopBar bell.
  rpc ListLowStock(ListLowStockRequest) returns (ListLowStockResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message ListMedicinesRequest {
  bool include_inactive = 1;
  int32 limit = 2;
  int32 offset = 3;
  string query = 4;          // optional ILIKE name / sku
  string opname_before = 5;  // YYYY-MM-DD. When set, include only medicines whose latest
                             // COMPLETED opname in the active warehouse is < this date OR
                             // who have never been counted there (overdue / never-counted).
}
message ListMedicinesResponse {
  repeated Medicine medicines = 1;
  int32 total = 2;
}

message GetMedicineRequest { string id = 1; }
message GetMedicineResponse { Medicine medicine = 1; }

message CreateMedicineRequest {
  reserved 3;
  reserved "manufacturer";
  string sku = 1;
  string name = 2;
  string unit = 4;            // base unit name (also used if `units` is empty)
  int64 unit_price = 5;       // base unit sell price
  bool prescription_required = 6;
  repeated MedicineUnitInput units = 7;  // optional; if empty, a base unit is created from unit/unit_price
}
message CreateMedicineResponse { Medicine medicine = 1; }

message UpdateMedicineRequest {
  reserved 3;
  reserved "manufacturer";
  string id = 1;
  string name = 2;
  string unit = 4;
  int64 unit_price = 5;
  bool prescription_required = 6;
  repeated MedicineUnitInput units = 7;  // upsert the full unit set (exactly one is_base, base factor 1)
}
message UpdateMedicineResponse { Medicine medicine = 1; }

message ArchiveMedicineRequest { string id = 1; }
message ArchiveMedicineResponse { Medicine medicine = 1; }

message ListMedicinePricesRequest { string medicine_id = 1; }
message ListMedicinePricesResponse {
  repeated MedicinePrice prices = 1;
}

message ListMedicineUnitPricesRequest { string medicine_id = 1; }
message ListMedicineUnitPricesResponse {
  repeated MedicineUnitPrice prices = 1;
}

message SearchMedicinesRequest {
  string query = 1;
  int32 limit = 2;
  bool include_inactive = 3;
}
message SearchMedicinesResponse {
  repeated Medicine medicines = 1;
}

// Minimal display ref for resolve-by-IDs name lookups.
message MedicineRef {
  string id = 1;
  string name = 2;
  string sku = 3;
}
message ResolveMedicinesRequest { repeated string ids = 1; }
message ResolveMedicinesResponse { repeated MedicineRef medicines = 1; }

message ListLowStockRequest {}
message ListLowStockResponse {
  repeated Medicine medicines = 1;     // ready_stock set (active warehouse)
  int32 threshold = 2;                 // the current low_stock_threshold setting
  int32 total = 3;                     // count of matching medicines (bell badge)
}
