syntax = "proto3";

package inventory_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/apotech/backend/gen/inventory_iface/v1;inventoryifacev1";

message Medicine {
  string id = 1;
  string sku = 2;
  string name = 3;
  string manufacturer = 4;
  string unit = 5;
  int64 unit_price = 6;
  bool prescription_required = 7;
  bool active = 8;
  int64 created_at = 9;
  int64 ready_stock = 10;     // on-hand in the active warehouse (list enrich)
  int64 on_order_stock = 11;  // incoming on open POs (list enrich)
  string last_restock_date = 12;      // YYYY-MM-DD of most recent batch receive (GetMedicine only)
  string last_restock_supplier = 13;  // supplier of that batch (GetMedicine only)
  int64 total_stock = 14;             // global on-hand across all warehouses (GetMedicine only)
  int64 stock_valuation = 15;         // global value at cost = Σ qty × cost_price (GetMedicine only)
}

message MedicinePrice {
  string id = 1;
  string medicine_id = 2;
  int64 unit_price = 3;
  int64 effective_from = 4;
  int64 effective_to = 5;
  string changed_by = 6;
}

service MedicineService {
  rpc ListMedicines(ListMedicinesRequest) returns (ListMedicinesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  rpc GetMedicine(GetMedicineRequest) returns (GetMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
  rpc CreateMedicine(CreateMedicineRequest) returns (CreateMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateMedicine(UpdateMedicineRequest) returns (UpdateMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ArchiveMedicine(ArchiveMedicineRequest) returns (ArchiveMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListMedicinePrices(ListMedicinePricesRequest) returns (ListMedicinePricesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SearchMedicines(SearchMedicinesRequest) returns (SearchMedicinesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
  }
}

message ListMedicinesRequest {
  bool include_inactive = 1;
  int32 limit = 2;
  int32 offset = 3;
  string query = 4;          // optional ILIKE name / sku
}
message ListMedicinesResponse {
  repeated Medicine medicines = 1;
  int32 total = 2;
}

message GetMedicineRequest { string id = 1; }
message GetMedicineResponse { Medicine medicine = 1; }

message CreateMedicineRequest {
  string sku = 1;
  string name = 2;
  string manufacturer = 3;
  string unit = 4;
  int64 unit_price = 5;
  bool prescription_required = 6;
}
message CreateMedicineResponse { Medicine medicine = 1; }

message UpdateMedicineRequest {
  string id = 1;
  string name = 2;
  string manufacturer = 3;
  string unit = 4;
  int64 unit_price = 5;
  bool prescription_required = 6;
}
message UpdateMedicineResponse { Medicine medicine = 1; }

message ArchiveMedicineRequest { string id = 1; }
message ArchiveMedicineResponse { Medicine medicine = 1; }

message ListMedicinePricesRequest { string medicine_id = 1; }
message ListMedicinePricesResponse {
  repeated MedicinePrice prices = 1;
}

message SearchMedicinesRequest {
  string query = 1;
  int32 limit = 2;
  bool include_inactive = 3;
}
message SearchMedicinesResponse {
  repeated Medicine medicines = 1;
}
