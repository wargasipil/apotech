syntax = "proto3";

package analytics_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/apotech/backend/gen/analytics_iface/v1;analyticsifacev1";

service InventoryAnalyticsService {
  rpc GetTurnover(GetTurnoverRequest) returns (GetTurnoverResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetDeadStock(GetDeadStockRequest) returns (GetDeadStockResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetDaysOfStockRemaining(GetDaysOfStockRemainingRequest) returns (GetDaysOfStockRemainingResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetExpiryRiskForecast(GetExpiryRiskForecastRequest) returns (GetExpiryRiskForecastResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message GetTurnoverRequest {
  int32 period_days = 1;   // e.g. 30 / 90 / 365
  int32 limit = 2;
}
message TurnoverRow {
  string medicine_id = 1;
  string medicine_name = 2;
  string sku = 3;
  int64 sold_qty = 4;
  int64 avg_inventory_qty = 5;
  double turnover_ratio = 6;   // sold_qty / max(avg_inventory_qty, 1)
}
message GetTurnoverResponse {
  repeated TurnoverRow rows = 1;
}

message GetDeadStockRequest {
  int32 no_movement_days = 1;  // default 60
}
message DeadStockRow {
  string medicine_id = 1;
  string medicine_name = 2;
  string sku = 3;
  int64 current_qty = 4;
  int64 last_sale_unix = 5;    // 0 if never sold
}
message GetDeadStockResponse {
  repeated DeadStockRow rows = 1;
}

message GetDaysOfStockRemainingRequest {
  int32 sample_days = 1;       // window for avg-daily calc; default 30
}
message DaysOfStockRow {
  string medicine_id = 1;
  string medicine_name = 2;
  string sku = 3;
  int64 current_qty = 4;
  double avg_daily_consumption = 5;
  double days_remaining = 6;   // current_qty / avg_daily; +inf if avg_daily == 0
}
message GetDaysOfStockRemainingResponse {
  repeated DaysOfStockRow rows = 1;
}

message GetExpiryRiskForecastRequest {}
message ExpiryBucket {
  int32 window_days = 1;       // 30 / 90 / 180
  int64 qty_at_risk = 2;       // sum of current batch qty for batches expiring in this window
  int64 value_at_risk = 3;     // sum of qty * cost_price
}
message GetExpiryRiskForecastResponse {
  repeated ExpiryBucket buckets = 1;
}
