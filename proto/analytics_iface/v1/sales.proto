syntax = "proto3";

package analytics_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/apotech/backend/gen/analytics_iface/v1;analyticsifacev1";

enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  GRANULARITY_DAY = 1;
  GRANULARITY_WEEK = 2;
  GRANULARITY_MONTH = 3;
}

enum SortMetric {
  SORT_METRIC_UNSPECIFIED = 0;
  SORT_METRIC_QTY = 1;
  SORT_METRIC_REVENUE = 2;
}

service SalesAnalyticsService {
  rpc GetRevenueTrend(GetRevenueTrendRequest) returns (GetRevenueTrendResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetTopSellers(GetTopSellersRequest) returns (GetTopSellersResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetPaymentMix(GetPaymentMixRequest) returns (GetPaymentMixResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetSalesByCashier(GetSalesByCashierRequest) returns (GetSalesByCashierResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetHourOfDayHeatmap(GetHourOfDayHeatmapRequest) returns (GetHourOfDayHeatmapResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message GetRevenueTrendRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  Granularity granularity = 3;
}
message RevenueTrendPoint {
  string bucket = 1;       // YYYY-MM-DD or YYYY-WW or YYYY-MM
  int64 revenue = 2;
  int64 sale_count = 3;
}
message GetRevenueTrendResponse {
  repeated RevenueTrendPoint points = 1;
}

message GetTopSellersRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  int32 limit = 3;
  SortMetric metric = 4;
}
message TopSeller {
  string medicine_id = 1;
  string medicine_name = 2;
  string sku = 3;
  int64 qty = 4;
  int64 revenue = 5;
}
message GetTopSellersResponse {
  repeated TopSeller items = 1;
}

message GetPaymentMixRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
}
message PaymentMixSlice {
  string payment_source = 1;  // CASH / BPJS / INSURANCE_OTHER
  int64 revenue = 2;
  int64 sale_count = 3;
}
message GetPaymentMixResponse {
  repeated PaymentMixSlice slices = 1;
}

message GetSalesByCashierRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
}
message CashierTotals {
  string user_id = 1;
  string user_email = 2;
  string user_name = 3;
  int64 revenue = 4;
  int64 sale_count = 5;
}
message GetSalesByCashierResponse {
  repeated CashierTotals items = 1;
}

message GetHourOfDayHeatmapRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
}
message HeatmapCell {
  int32 day_of_week = 1;   // 0 = Sun .. 6 = Sat (postgres EXTRACT(DOW))
  int32 hour = 2;          // 0..23
  int64 sale_count = 3;
  int64 revenue = 4;
}
message GetHourOfDayHeatmapResponse {
  repeated HeatmapCell cells = 1;
}
