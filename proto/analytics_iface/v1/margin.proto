syntax = "proto3";

package analytics_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/apotech/backend/gen/analytics_iface/v1;analyticsifacev1";

service MarginAnalyticsService {
  rpc GetMarginPerMedicine(GetMarginPerMedicineRequest) returns (GetMarginPerMedicineResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetTopMargin(GetTopMarginRequest) returns (GetTopMarginResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetSupplierCostTrend(GetSupplierCostTrendRequest) returns (GetSupplierCostTrendResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message MarginRow {
  string medicine_id = 1;
  string medicine_name = 2;
  string sku = 3;
  int64 revenue = 4;
  int64 cogs = 5;             // sum of qty * batch.cost_price for consumed batches
  int64 gross_margin = 6;     // revenue - cogs
  double margin_pct = 7;      // gross_margin / max(revenue, 1)
  int64 qty = 8;
}

message GetMarginPerMedicineRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  int32 limit = 3;
}
message GetMarginPerMedicineResponse {
  repeated MarginRow rows = 1;
}

message GetTopMarginRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  int32 limit = 3;
}
message GetTopMarginResponse {
  repeated MarginRow rows = 1;
}

message GetSupplierCostTrendRequest {
  string supplier_id = 1;
  string medicine_id = 2;  // optional
}
message CostTrendPoint {
  string received_at = 1;  // YYYY-MM-DD
  int64 cost_price = 2;
  string batch_number = 3;
  string medicine_name = 4;
}
message GetSupplierCostTrendResponse {
  repeated CostTrendPoint points = 1;
}
